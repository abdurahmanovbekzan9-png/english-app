 const lv=["all","A1","A2","B1","B2"].map(v=>'<button class="chip '+(SP.lv==v?"on":"")+'" onclick="SP.lv=\''+v+'\';sp()">'+(v=="all"?"Все":v)+'</button>').join("");
 const tp=['<button class="chip '+(SP.tp=="all"?"on":"")+'" onclick="SP.tp=\'all\';sp()">Все темы</button>'].concat(SP.tops.map((t,k)=>'<button class="chip '+(SP.tp==t?"on":"")+'" onclick="SP.tp=SP.tops['+k+'];sp()">'+esc(t)+'</button>')).join("");
 $("app").innerHTML=hd("Speaking")+'<h2 style="margin-top:0">Уровень</h2><div class="chips">'+lv+'</div><h2>Тема</h2><div class="chips">'+tp+'</div><div style="height:90px"></div><div class="foot"><div class="inner"><button class="btn" onclick="spq()">Получить вопрос</button></div></div>';
}
function spq(){
 const l=SP.q.filter(x=>(SP.lv=="all"||x.l==SP.lv)&&(SP.tp=="all"||x.t==SP.tp));if(!l.length)return alert("Нет вопросов под этот выбор");
 clearInterval(SP.tm);const x=SP.cur=l[Math.random()*l.length|0];
 $("app").innerHTML=hd("Speaking")+'<p>'+x.l+' · '+esc(x.t)+'</p><div class="fcard" style="cursor:default;margin-bottom:12px"><div class="ru" style="font-size:24px">'+esc(x.q)+'</div><button class="x" onclick="spsay()">🔊</button><p id="sptm"></p></div><button class="btn sec" onclick="spt()">⏱ Подготовка 1 минута</button><p class="c" style="margin-top:14px">Ответьте вслух, 3-5 предложений</p><div class="foot"><div class="inner row" style="gap:10px"><button class="btn sec" onclick="spq()">Другой</button><button class="btn" onclick="spd()">Я ответил +5 XP</button></div></div>';
}
function spsay(){try{const u=new SpeechSynthesisUtterance(SP.cur.q);u.lang="en-US";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function spt(){clearInterval(SP.tm);let s=60;SP.tm=setInterval(()=>{const e=$("sptm");if(!e){clearInterval(SP.tm);return}e.textContent=s>0?"⏱ 0:"+String(s).padStart(2,"0"):"Время! Говорите 🎤";if(s--<=0)clearInterval(SP.tm)},1000)}
function spd(){P.xp+=5;tick();saveP();spq()}
async function lessons(){
 $("ov").innerHTML="";$("app").innerHTML=hd("Мои занятия")+'<p class="c">Загружаю…</p>';
 let a=null;try{a=(await (await fetch(API_URL+"?action=attendance&uid="+encodeURIComponent(U.id)+"&init="+encodeURIComponent((tg&&tg.initData)||""))).json()).att}catch(e){}
 if(!a){$("app").innerHTML=hd("Мои занятия")+'<p class="c">Данные о занятиях пока не внесены. Спросите учителя.</p>';return}
 const rem=a.paid-a.attended,pc=a.paid?Math.min(100,a.attended/a.paid*100):0;
 $("app").innerHTML=hd("Мои занятия")+'<div class="stat c"><p>Осталось занятий</p><div class="big">'+rem+'</div><div class="bar"><i style="width:'+pc+'%"></i></div><p style="margin-top:10px">Посещено '+a.attended+' из '+a.paid+'</p></div>'+(a.next?'<div class="stat" style="margin-top:12px"><p>Следующее занятие</p><b style="font-size:20px">'+esc(a.next)+'</b></div>':'')+(a.note?'<p style="margin-top:12px">'+esc(a.note)+'</p>':'');
}
loadW();load();
</script></body></html>
