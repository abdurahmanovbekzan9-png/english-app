const FALLBACK_TN={"present": {"n": "Present Simple", "i": "🟢"}, "continuous": {"n": "Present Continuous", "i": "🔵"}, "past": {"n": "Past Simple", "i": "🟠"}, "be": {"n": "To be", "i": "🟣"}, "future": {"n": "Future Simple", "i": "🟡"}, "perfect": {"n": "Present Perfect", "i": "🔴"}};
let OFF="";
async function load(){
 $("app").innerHTML='<p class="c" style="margin-top:40vh">Загружаю упражнения…</p>';
 try{
  const [a,b]=await Promise.all([fetch(url("Tenses")).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}),fetch(url("Sentences")).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()})]);
  if(a.trim().startsWith("<")||b.trim().startsWith("<"))throw new Error("таблица закрыта для чтения");
  csv(a).slice(1).forEach(r=>{if(r[0])TN[r[0].trim()]={n:r[1],i:r[2]||"📘"}});
  DB=csv(b).filter(r=>/^\d+$/.test((r[0]||"").trim())&&r[1]&&r[4]).map(r=>{const s=[];for(let i=6;i+1<r.length;i+=2)if((r[i+1]||"").trim())s.push([(r[i]||"").trim(),r[i+1].trim()]);return{id:r[0].trim(),tense:r[1].trim(),type:r[2].trim(),lvl:+r[3]||1,ru:r[4],s}}).filter(x=>x.s.length);
  if(!DB.length)throw new Error("в таблице не найдено предложений");
 }catch(e){
  OFF=String((e&&e.message)||e);DB=FALLBACK;
  if(!Object.keys(TN).length)TN=FALLBACK_TN;
 }

}
function nav(){return '<div class="nav"><button class="'+(tab=="home"?"on":"")+'" onclick="tab=\'home\';view()">📚 Учиться</button><button class="'+(tab=="profile"?"on":"")+'" onclick="tab=\'profile\';view()">👤 Профиль</button></div>'}
function view(){ $("ov").innerHTML=""; tab=="profile"?profile():home() }
function home(){
 $("app").innerHTML='<h1>Привет, '+esc(U.first_name||"друг")+'! 👋</h1><div class="pills"><span class="pill">🔥 '+P.streak+'</span><span class="pill">⭐ '+P.xp+' XP</span></div>'+
 (OFF?'<p style="font-size:12px">⚠️ Таблица недоступна ('+esc(OFF)+'). Работает встроенная база.</p>':'')+'<h2 style="margin-top:0">Упражнения</h2>'+
 '<button class="card" onclick="setup()"><span class="ic">🧩</span><span><b>Word Order</b><p>Собери предложение из облачков</p></span></button>'+
 '<div class="card off"><span class="ic">📝</span><span><b>Мои слова</b><p>Скоро: свои слова и карточки</p></span></div>'+nav();
}
function profile(){
 const acc=P.solved?Math.round(P.correct/P.solved*100):0,n=(U.first_name||"?")+" "+(U.last_name||"");
 $("app").innerHTML='<div class="c"><div class="av">'+esc((U.first_name||"?")[0].toUpperCase())+'</div><h1 style="margin:0">'+esc(n.trim())+'</h1><p>'+(U.username?"@"+esc(U.username):"ID "+U.id)+'</p></div><h2>Статистика</h2><div class="grid">'+

const chips=(k,opts)=>'<div class="chips">'+opts.map(o=>'<button class="chip '+(F[k]==o[0]?"on":"")+'" onclick="F.'+k+'=\''+o[0]+'\';setup()">'+o[1]+'</button>').join("")+'</div>';
function setup(){
 const tn=[["all","🔄 Все"]].concat(Object.keys(TN).map(k=>[k,TN[k].i+" "+TN[k].n]));
 $("app").innerHTML='<div class="top"><button class="x" onclick="view()">✕</button><h1 style="margin:0">Word Order</h1></div><h2 style="margin-top:0">Время</h2>'+chips("tense",tn)+
 '<h2>Тип предложения</h2>'+chips("type",[["all","🔄 Все"]].concat(Object.entries(TYPES)))+'<h2>Сложность</h2>'+chips("level",[["all","🔄 Все"],[1,"🌱 Лёгкий"],[2,"🌿 Средний"],[3,"🌳 Сложный"]])+
 '<div style="height:90px"></div><div class="foot"><div class="inner"><button class="btn" onclick="start()">Начать</button></div></div>';

}
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
 let q=DB.filter(x=>(F.tense=="all"||x.tense==F.tense)&&(F.type=="all"||x.type==F.type)&&(F.level=="all"||x.lvl==F.level));
 if(!q.length){alert("Нет предложений под этот выбор");return}
 G={list:sh(q).slice(0,10),i:0,score:0,bad:[]};q_();
}
function q_(){const it=G.list[G.i];G.cards=sh(it.s.map((x,i)=>({id:i,w:x[1]})));G.placed=it.s.map(()=>null);G.chk=false;game()}
function game(){
 const it=G.list[G.i],full=!G.placed.includes(null);
 const sl=it.s.map((x,k)=>{const c=G.placed[k],w=c!==null?G.cards.find(z=>z.id==c).w:null;
  const st=G.chk?(w==x[1]?" ok":" bad"):"";
  return '<div class="slot'+(w?" full":"")+st+'" onclick="rm('+k+')">'+(w?esc(w):'<small>'+esc(x[0])+'</small>')+'</div>'}).join("");
 const pool=G.cards.filter(c=>!G.placed.includes(c.id)).map(c=>'<button class="chip" onclick="put('+c.id+')">'+esc(c.w)+'</button>').join("");
 $("app").innerHTML='<div class="top"><button class="x" onclick="if(confirm(\'Выйти? Прогресс этой сессии не сохранится.\'))view()">✕</button><div class="bar"><i style="width:'+(G.i/G.list.length*100)+'%"></i></div></div>'+
 '<p>'+(TN[it.tense]?TN[it.tense].n:it.tense)+' · '+(TYPES[it.type]||it.type)+'</p><div class="ru">'+esc(it.ru)+'</div><p>Собери предложение по-английски</p><div class="slots">'+sl+'</div><div class="pool">'+pool+'</div>'+
 (G.chk?'':'<div class="foot"><div class="inner"><button class="btn" '+(full?"":"disabled")+' onclick="check()">Проверить</button></div></div>');
}
function put(id){if(G.chk)return;const e=G.placed.indexOf(null);if(e>-1){G.placed[e]=id;game()}}
function rm(k){if(G.chk||G.placed[k]===null)return;G.placed[k]=null;game()}
function check(){
 const it=G.list[G.i];G.chk=true;
 const ok=it.s.every((x,k)=>G.cards.find(z=>z.id==G.placed[k]).w==x[1]);
 P.solved++;if(ok){G.score++;P.correct++;P.xp+=10}else G.bad.push(it);
 const d=new Date().toDateString();if(P.last!==d){P.streak++;P.last=d}saveP();
 send(it,ok);game();
 const last=G.i==G.list.length-1;
 $("ov").innerHTML='<div class="sheet '+(ok?"ok":"bad")+'"><div class="inner"><b>'+(ok?"Верно! +10 XP":"Неверно")+'</b>'+(ok?'':'<p style="color:var(--t)">Правильно: <b style="display:inline;font-size:inherit;color:inherit">'+esc(it.s.map(x=>x[1]).join(" "))+'</b></p>')+'<br><button class="btn" style="'+(ok?'':'background:var(--bad);border-bottom-color:#B35A5A')+'" onclick="nx()">'+(last?"Результат":"Дальше")+'</button></div></div>';
}
function nx(){$("ov").innerHTML="";if(G.i<G.list.length-1){G.i++;q_()}else done()}
function done(){
 const n=G.list.length,pc=Math.round(G.score/n*100);
 $("app").innerHTML='<div class="c" style="margin-top:8vh"><p>Сессия завершена</p><div class="big">'+G.score+'/'+n+'</div><h2>'+(pc>=90?"Отлично! 🎉":pc>=60?"Хороший результат 👍":"Продолжай тренироваться 💪")+'</h2><p>+'+(G.score*10)+' XP</p></div>'+
 (G.bad.length?'<h2>Работа над ошибками</h2>'+G.bad.map(x=>'<div class="stat" style="margin-bottom:8px"><b style="font-size:16px">'+esc(x.s.map(y=>y[1]).join(" "))+'</b><p>'+esc(x.ru)+'</p></div>').join(""):'')+
 '<div style="height:150px"></div><div class="foot"><div class="inner"><button class="btn" onclick="start()">Ещё раз</button><div style="height:8px"></div><button class="btn sec" onclick="view()">На главную</button></div></div>';
}
function send(it,ok){
 if(!API_URL)return;
 const body={uid:U.id,name:((U.first_name||"")+" "+(U.last_name||"")).trim(),username:U.username||"",sid:it.id,tense:it.tense,type:it.type,lvl:it.lvl,ok:ok?1:0,answer:G.placed.map(c=>G.cards.find(z=>z.id==c).w).join(" ")};
 try{fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)}).catch(()=>{})}catch(e){}
}
load();
</script></body></html>
